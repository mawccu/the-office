<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Chat · The Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<!-- ?v= busts the browser/Pages cache — bump it whenever js/css change -->
<link rel="stylesheet" href="style.css?v=22" />
</head>
<body>
<div class="bg-decor" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="index.html">
    <span class="brand-mark"></span>
    <span class="brand-name">The<span>Office</span></span>
  </a>
  <nav class="mainnav" id="mainnav"></nav>
  <div class="whoami" id="whoami"></div>
</header>

<main>
  <section class="intro chat-intro reveal">
    <h1 class="display">Chat.</h1>
    <p class="lede">For the six members and the admin. See who's around right now.</p>
  </section>

  <section id="fundGate" class="card narrow-gate reveal" hidden></section>

  <div id="fundBody" hidden>
    <div class="chat-grid">
      <section class="card chat-card reveal">
        <div class="chat-scroll" id="chatScroll" aria-live="polite">
          <div class="chat-list" id="chatList"></div>
        </div>
        <form class="chat-compose" id="chatForm" autocomplete="off">
          <textarea id="chatInput" class="fld" rows="1" maxlength="1000" placeholder="Write a message"></textarea>
          <button class="btn primary" id="chatSend" type="submit">Send</button>
        </form>
      </section>
      <aside class="card people-card reveal">
        <div class="card-head"><span>People</span><span class="hint" id="peopleHint"></span></div>
        <div class="people-list" id="peopleList"></div>
      </aside>
    </div>
  </div>
</main>

<div class="overlay" id="authOverlay">
  <div class="modal">
    <h2>Sign in</h2>
    <div class="sub">Your name and a PIN. We'll remember you on this device so you don't sign in again.</div>
    <div class="auth-fields">
      <input id="authName" class="fld" type="text" placeholder="Your name" autocomplete="name" />
      <input id="authPin" class="fld" type="password" inputmode="numeric" placeholder="PIN (4+ digits)" autocomplete="off" />
    </div>
    <div class="auth-err" id="authErr"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="authCancel">Cancel</button>
      <button class="btn primary" id="authSubmit">Continue</button>
    </div>
    <div class="auth-foot">New name? It's created with the PIN you type. Returning? Use the same PIN.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=22"></script>
<script src="config.js?v=22"></script>
<script src="core.js?v=22"></script>
<script src="fund-core.js?v=22"></script>
<script src="chat.js?v=22"></script>
</body>
</html>
