<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Expenses · The Office</title>
<meta name="theme-color" content="#111110" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="The Office" />
<script>
  // theme + language before first paint (no flash)
  (function () { try {
    var t = localStorage.getItem("theme"), l = localStorage.getItem("lang"), d = document.documentElement;
    if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) d.dataset.theme = "dark";
    if (l === "ar") { d.lang = "ar"; d.dir = "rtl"; }
  } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!-- ?v= busts the browser/Pages cache — bump it whenever js/css change -->
<link rel="stylesheet" href="style.css?v=31" />
</head>
<body>
<div class="bg-decor" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="fund.html">
    <span class="brand-mark"></span>
    <span class="brand-name">The<span>Office</span></span>
  </a>
  <nav class="mainnav" id="mainnav"></nav>
  <div class="top-tools" id="topTools"></div>
  <div class="whoami" id="whoami"></div>
</header>

<main>
  <section class="intro reveal">
    <div class="intro-head">
      <div>
        <h1 class="display">Expenses.</h1>
        <p class="lede">The bills we pay every month, and the things we want to buy. A wishlist item is only bought if all six members say yes.</p>
      </div>
      <div class="intro-stats">
        <div class="stat"><span class="stat-label">Bills a month</span><span class="stat-val" id="statMonthly">—</span></div>
        <div class="stat"><span class="stat-label">Open votes</span><span class="stat-val" id="statVotes">—</span></div>
      </div>
    </div>
  </section>

  <section id="fundGate" class="card narrow-gate reveal" hidden></section>

  <div id="fundBody" hidden>
    <section class="card fund-section reveal" id="bills">
      <div class="card-head"><span>Monthly bills</span><span class="hint" id="billsHint"></span></div>
      <div class="bill-list" id="billList"></div>
    </section>

    <section class="fund-section reveal" id="wishlist">
      <div class="section-head with-action"><span>Wishlist</span><button class="btn primary small" id="proposeBtn">Propose something</button></div>
      <div class="wish-group-label">Voting now</div>
      <div class="wish-list" id="wishOpen"></div>
      <div class="wish-group-label">Approved · waiting for the admin to buy</div>
      <div class="wish-list" id="wishApproved"></div>
      <div class="wish-group-label">Closed</div>
      <div class="wish-list" id="wishClosed"></div>
    </section>
  </div>
</main>

<div class="overlay" id="authOverlay">
  <div class="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=31"></script>
<script src="config.js?v=31"></script>
<script src="core.js?v=31"></script>
<script src="lang.js?v=31"></script>
<script src="fund-core.js?v=31"></script>
<script src="expenses.js?v=31"></script>
</body>
</html>
